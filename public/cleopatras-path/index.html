        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            user-select: none;
        }

        #pano-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /*
         * Aggressively hide ALL Pano2VR UI overlays:
         * – ggskin_* elements (skin overlays, hotspots, buttons, menus)
         * – gg_contextmenu (right-click branding menu)
         * – gg_about / any about dialog
         * – Any absolutely-positioned div that is NOT a canvas
         */
        #pano-container div:not([class]),
        #pano-container div[class=""],
        .ggskin_button,
        .ggskin_hotspot,
        .ggskin_container,
        .ggskin_text,
        .ggskin_menubar,
        .ggskin_menu,
        .ggskin_external,
        .ggskin_svg,
        .ggskin_nodeimage,
        .ggskin_rectangle,
        .gg_contextmenu,
        .gg_context_row,
        [class*="ggskin"],
        [class*="gg_"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
