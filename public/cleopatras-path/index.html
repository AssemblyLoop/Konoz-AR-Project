<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Cleopatra's Bath – 360°</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #pano-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Hide ONLY named skin/UI classes — do NOT touch class-less divs (player needs those for WebGL) */
        [class*="ggskin"],
        [class*="gg_"] {
            display: none !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <div id="pano-container"></div>

    <script type="text/javascript" src="/cleopatras-path/pano2vr_player.js"></script>

    <script type="text/javascript">
        // Block right-click so the context menu (with the Marsa Alam logo) never appears
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, true);

        // Initialise the player
        var pano = new pano2vrPlayer('pano-container');
        pano.readConfigUrlAsync('/cleopatras-path/pano.xml');

        // MutationObserver: hide only specific UI injections, never touch class-less divs
        var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                mutation.addedNodes.forEach(function(node) {
                    if (node.nodeType !== 1) return;
                    var cls = (node.getAttribute && node.getAttribute('class')) || '';

                    // Hide skin overlays and context-menu elements by class name
                    if (cls.indexOf('ggskin') !== -1 || cls.indexOf('gg_') !== -1) {
                        node.style.cssText = 'display:none!important;pointer-events:none!important;';
                        return;
                    }

                    // The player context menu is a plain div with z-index 32000 — kill it
                    if (node.tagName && node.tagName.toLowerCase() === 'div') {
                        var z = parseInt((node.style && node.style.zIndex) || '0', 10);
                        if (z >= 32000) {
                            node.style.cssText = 'display:none!important;pointer-events:none!important;';
                        }
                    }
                });
            });
        });

        observer.observe(document.getElementById('pano-container'), { childList: true, subtree: true });

        // Fallback sweep every 500 ms — only removes explicit context-menu and high-z overlay divs
        function purgeOverlays() {
            document.querySelectorAll('[class*="gg_contextmenu"], [class*="ggskin"]').forEach(function(el) {
                el.style.cssText = 'display:none!important;pointer-events:none!important;';
            });
        }
        setInterval(purgeOverlays, 500);
    </script>

    <noscript><p><b>Please enable JavaScript.</b></p></noscript>
</body>
</html>
