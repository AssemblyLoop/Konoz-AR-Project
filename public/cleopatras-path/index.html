<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Cleopatra's Bath – 360°</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            user-select: none;
        }

        #pano-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /*
         * Aggressively hide ALL Pano2VR UI overlays:
         * – ggskin_* elements (skin overlays, hotspots, buttons, menus)
         * – gg_contextmenu (right-click branding menu)
         * – gg_about / any about dialog
         * – Any absolutely-positioned div that is NOT a canvas
         */
        #pano-container div:not([class]),
        #pano-container div[class=""],
        .ggskin_button,
        .ggskin_hotspot,
        .ggskin_container,
        .ggskin_text,
        .ggskin_menubar,
        .ggskin_menu,
        .ggskin_external,
        .ggskin_svg,
        .ggskin_nodeimage,
        .ggskin_rectangle,
        .gg_contextmenu,
        .gg_context_row,
        [class*="ggskin"],
        [class*="gg_"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Ensure only canvas elements are visible */
        canvas {
            display: block !important;
        }
    </style>
</head>
<body>

    <div id="pano-container"></div>

    <script type="text/javascript" src="/cleopatras-path/pano2vr_player.js"></script>

    <script type="text/javascript">
        // ── Block the right-click context menu entirely ──────────────────────
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, true);

        // ── Initialise the 360 player ────────────────────────────────────────
        var pano = new pano2vrPlayer('pano-container');
        pano.readConfigUrlAsync('/cleopatras-path/pano.xml');

        // ── MutationObserver: destroy every non-canvas element the player injects ──
        var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                mutation.addedNodes.forEach(function(node) {
                    if (node.nodeType !== 1) return; // elements only

                    var tag = node.tagName ? node.tagName.toLowerCase() : '';
                    var cls = (node.className || '').toString();

                    // Allow: canvas, the outer wrapper divs the player needs
                    if (tag === 'canvas') return;

                    // Kill anything that looks like a skin overlay / context menu / about
                    if (
                        cls.indexOf('ggskin')   !== -1 ||
                        cls.indexOf('gg_')       !== -1 ||
                        tag === 'hr'                    ||
                        tag === 'style'
                    ) {
                        node.remove();
                        return;
                    }

                    // For plain divs injected by the player (context menu, about panel),
                    // hide them and strip pointer-events so they're inert.
                    if (tag === 'div') {
                        var zIndex = parseInt(
                            (node.style && node.style.zIndex) || '0', 10
                        );
                        // Player context menu uses z-index 32000; about uses high z-indices
                        if (zIndex > 1000) {
                            node.style.cssText = 'display:none!important;pointer-events:none!important;';
                        }
                    }
                });
            });
        });

        observer.observe(document.body, { childList: true, subtree: true });

        // ── Periodic cleanup: nuke any surviving overlays ────────────────────
        function purgeOverlays() {
            // Context menus
            document.querySelectorAll('.gg_contextmenu, [class*="ggskin"]').forEach(function(el) {
                el.style.cssText = 'display:none!important;';
            });
            // High-z-index divs that aren't the pano container itself
            document.querySelectorAll('#pano-container > div').forEach(function(el) {
                var z = parseInt(el.style.zIndex || '0', 10);
                if (z > 1000) el.style.cssText = 'display:none!important;pointer-events:none!important;';
            });
        }

        setInterval(purgeOverlays, 400);
        window.addEventListener('load', purgeOverlays);
    </script>

    <noscript><p><b>Please enable JavaScript.</b></p></noscript>
</body>
</html>
